---
# options that determine the behavior of SV finding algorithms
options:
    min_n_observed:
        order: 1
        short: null
        type: integer
        required: false
        default: 1
        description: "only report SVs with at least this many independent reads supporting them"
    min_sv_mapq:
        order: 2
        short: null
        type: integer
        required: false
        default: 0
        description: "only report SVs with at least this MAPQ in each of the two flanking alignments"
