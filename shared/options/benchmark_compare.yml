---
# options that determine the behavior of benchmarking algorithms
options:
    min-sv-len:
        order: 1
        short: null
        type: integer
        required: false
        default: 100
        description: "only report SVs of at least this length (INV have special handling)"
    truthset-dir: 
        order: 2
        short: null
        type: string
        required: true
        default: null
        description: "directory containing a truth-set VCF with INFO/FRAGSIZES" 
    truthset-is-composite-genome:
        order: 3
        short: null
        type: boolean
        required: false
        default: false
        description: "truthset genome is a composite of >1 reference e.g., with cross-species spike-in"
